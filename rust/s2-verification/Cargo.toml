[package]
name = "s2-verification"
version = "0.4.0"
edition = "2024"
license = "MIT"

[dependencies]
antithesis_sdk = { version = "0.3.0", default-features = false, features = ["full", "rand_v0_10"] }
clap = { version = "4.6.7", features = ["derive"] }
eyre = "0.6.14"
futures = "0.3.34"
# must match the rand_v0_* feature of antithesis_sdk
rand = "0.10"
s2-sdk = ">=0.34, <1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tokio-stream = "0.1.19"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
